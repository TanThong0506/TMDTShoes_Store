{% extends 'base.html' %}  

{% block content %}
<div class="auth-wrapper">
    <!-- Animated Blobs -->
    <div class="auth-blob blob-1"></div>
    <div class="auth-blob blob-2"></div>

    <div class="premium-auth-card">
        <h2>ĐĂNG NHẬP</h2>
        <p>Chào mừng bạn quay lại với Shoe Store Premium!</p>

        <form action="" method="POST">
            {% csrf_token %}  
            
            <div class="premium-input-group">
                <label for="username">Tên đăng nhập / Email</label>
                <input type="text" id="username" name="username" class="premium-input" placeholder="Nhập tài khoản của bạn" required>
            </div>

            <div class="premium-input-group">
                <label for="password">Mật khẩu</label>
                <input type="password" id="password" name="password" class="premium-input" placeholder="Nhập mật khẩu" required>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4" style="font-size: 0.9rem;">
                <div class="d-flex align-items-center gap-2">
                    <input type="checkbox" id="remember" name="remember" style="accent-color: var(--accent-primary);">
                    <label for="remember" style="color: var(--text-secondary); margin: 0; cursor: pointer;">Ghi nhớ tôi</label>
                </div>
                <a href="{% url 'forgot_password' %}" style="color: var(--accent-primary); font-weight: 600;">Quên mật khẩu?</a>
            </div>

            <button type="submit" class="premium-btn w-100 mb-4" style="padding: 16px;">ĐĂNG NHẬP</button>
        </form>

        <div class="text-center" style="font-size: 0.95rem; color: var(--text-secondary);">
            Bạn chưa có tài khoản? <a href="{% url 'register' %}" style="color: var(--accent-primary); font-weight: bold; margin-left: 5px;">Đăng ký ngay</a>
        </div>
    </div>
</div>
{% endblock %}

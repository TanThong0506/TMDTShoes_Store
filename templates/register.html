{% extends 'base.html' %} 

{% block content %}
<div class="auth-wrapper">
    <!-- Animated Blobs -->
    <div class="auth-blob blob-1" style="background: rgba(51, 153, 255, 0.2);"></div>
    <div class="auth-blob blob-2" style="background: rgba(255, 51, 102, 0.2);"></div>

    <div class="premium-auth-card" style="max-width: 500px;">
        <h2>ĐĂNG KÝ</h2>
        <p>Tạo tài khoản mới để trải nghiệm mua sắm đẳng cấp.</p>

        <form action="" method="POST" novalidate id="registerForm">
            {% csrf_token %}  
            
            <div class="premium-input-group">
                <label for="full_name">Họ tên</label>
                <input type="text" id="full_name" name="full_name" class="premium-input" placeholder="Nhập họ tên của bạn" maxlength="50" value="{{ request.POST.full_name }}">
            </div>

            <div class="premium-input-group">
                <label for="email">Địa chỉ Email</label>
                <input type="email" id="email" name="email" class="premium-input" placeholder="Nhập email của bạn" value="{{ request.POST.email }}">
            </div>

            <div class="premium-input-group">
                <label for="phone">Số điện thoại</label>
                <input type="text" id="phone" name="phone" class="premium-input" placeholder="Nhập số điện thoại" value="{{ request.POST.phone }}">
            </div>

            <div class="row">
                <div class="col-md-6">
                    <div class="premium-input-group">
                        <label for="password">Mật khẩu</label>
                        <input type="password" id="password" name="password" class="premium-input" placeholder="Tạo mật khẩu">
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="premium-input-group">
                        <label for="confirm_password">Xác nhận</label>
                        <input type="password" id="confirm_password" name="confirm_password" class="premium-input" placeholder="Nhập lại mật khẩu">
                    </div>
                </div>
            </div>

            <button type="submit" class="premium-btn w-100 mb-4" id="submitBtn" style="padding: 16px;">TẠO TÀI KHOẢN</button>
        </form>

        <script>
            document.getElementById('registerForm').addEventListener('submit', function() {
                var btn = document.getElementById('submitBtn');
                setTimeout(function() {
                    btn.disabled = true;
                    btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i> ĐANG XỬ LÝ...';
                    btn.style.opacity = '0.7';
                    btn.style.cursor = 'not-allowed';
                }, 10);
            });
        </script>

        <div class="text-center" style="font-size: 0.95rem; color: var(--text-secondary);">
            Bạn đã có tài khoản? <a href="{% url 'login' %}" style="color: var(--accent-primary); font-weight: bold; margin-left: 5px;">Đăng nhập ngay</a>
        </div>
    </div>
</div>
{% endblock %}
